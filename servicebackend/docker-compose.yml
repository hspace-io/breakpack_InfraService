version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: wargame_postgres
    restart: always
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wargame_net

volumes:
  postgres_data:

networks:
  wargame_net: